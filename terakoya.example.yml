# Every key is optional except bot_token. Environment variables
# (TERAKOYA_<KEY in upper case>) override the values in this file.
bot_token: ""
bot_username: ""
repo_dir: ./content
repo_url: ""
repo_branch: main
data_dir: ./data
cache_chat_id: 0
ranks: "Novice:0,Pupil:1,Student:3,Scholar:7,Mentor:15,Teacher:30,Master:60,Sage:100"
log_level: info
# Telegram user IDs of the admins who grant edit access, comma-separated.
admin_ids: ""
# SVG drawings are rasterized with resvg (included in the Docker image).
# resvg: resvg
# fonts_dir: /usr/share/fonts/dejavu

# Suggestions, git webhooks and content sync (all off while git_host is empty).
git_host: ""            # github or forgejo
git_api_url: ""         # Forgejo base URL, e.g. https://git.example.org; GitHub: https://api.github.com
git_repo: ""            # owner/name of the content repository
git_token: ""
git_webhook_secret: ""
git_author_name: terakoya
git_author_email: terakoya@localhost
# Label that marks an error report (an issue) as accepted.
# accepted_label: accepted
http_addr: ":8080"
sync_interval: 5m
suggest_cooldown: 1m
suggest_max_open: 5
suggest_max_bytes: 262144
image_max_bytes: 5242880
