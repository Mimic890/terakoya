services:
  terakoya:
    build: .
    restart: unless-stopped
    # Run as the owner of the bind-mounted directories.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    ports:
      # Git host webhooks; put a TLS reverse proxy in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/srv/data
      - ./vault:/srv/vault
