services:
  terakoya:
    build: .
    restart: unless-stopped
    # Run as the owner of the bind-mounted directories.
    user: "${UID:-1000}:${GID:-1000}"
    # The bot needs about 30 MB; the cap keeps a runaway SVG conversion
    # from taking the server's memory.
    mem_limit: 512m
    env_file: .env
    environment:
      # The time zone of the daily backup time in settings.yml.
      TZ: Europe/Minsk
    ports:
      # Git host webhooks; put a TLS reverse proxy in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/srv/data
      - ./vault:/srv/vault
